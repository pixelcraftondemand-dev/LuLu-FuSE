apiVersion: apps/v1
kind: Deployment
metadata:
  name: lulu-fuse-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lulu-fuse-api
  template:
    metadata:
      labels:
        app: lulu-fuse-api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/lulu-fuse-api:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
